const MUSCLE_GROUPS = [
  { id: "Arms", pattern: "mixed" },
  { id: "Shoulders", pattern: "push" },
  { id: "Chest", pattern: "push" },
  { id: "Back", pattern: "pull" },
  { id: "Core", pattern: "core" },
  { id: "Legs", pattern: "legs" },
];

function groupPattern(id) {
  return MUSCLE_GROUPS.find((g) => g.id === id)?.pattern || "other";
}

function conflictScore(pA, pB) {
  if (pA === pB) return pA === "legs" || pA === "core" ? 0.5 : 3;
  const key = [pA, pB].sort().join("-");
  const table = {
    "mixed-pull": 2,
    "mixed-push": 2,
    "core-mixed": 0.5,
    "legs-mixed": 0,
    "pull-push": 1,
    "core-push": 0,
    "legs-push": 0,
    "core-pull": 0,
    "legs-pull": 0,
    "core-legs": 0,
  };
  return table[key] ?? 0;
}

function permutations(arr) {
  if (arr.length <= 1) return [arr];
  const result = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
    for (const p of permutations(rest)) result.push([arr[i], ...p]);
  }
  return result;
}

function optimalOrder(remainingIds, lastGroupId) {
  if (remainingIds.length === 0) return [];
  if (remainingIds.length > 7) return remainingIds;
  let best = remainingIds;
  let bestScore = Infinity;
  for (const perm of permutations(remainingIds)) {
    let score = 0;
    let prevPattern = lastGroupId ? groupPattern(lastGroupId) : null;
    for (const id of perm) {
      const pattern = groupPattern(id);
      if (prevPattern) score += conflictScore(prevPattern, pattern);
      prevPattern = pattern;
    }
    if (score < bestScore) {
      bestScore = score;
      best = perm;
    }
  }
  return best;
}

function reasonFor(nextId, lastId) {
  if (!lastId) return "First session of the week — good place to start.";
  const score = conflictScore(groupPattern(lastId), groupPattern(nextId));
  if (score === 0) return `Minimal overlap with ${lastId} — you're fully fresh for this.`;
  if (score <= 1) return `Light crossover with ${lastId}, nothing maxed out yet.`;
  return `Some shared muscles with ${lastId} — expect it to feel a bit more taxed.`;
}

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

function estimate1RM(weight, reps, rpe) {
  const rir = rpe ? Math.max(0, 10 - rpe) : 0;
  const effectiveReps = reps + rir;
  if (effectiveReps <= 1) return weight;
  return Math.round(weight * (1 + effectiveReps / 30));
}

const REP_LADDER = [15, 12, 10, 8];

function roundToNearest(x, step = 5) {
  return Math.round(x / step) * step;
}

function ladderFor(exerciseId, history) {
  const foundation = foundationFor(exerciseId, history);
  const oneRM = foundation ? estimate1RM(foundation.weight, foundation.reps, foundation.rpe) : null;
  return REP_LADDER.map((reps) => ({
    reps,
    weight: oneRM ? roundToNearest(oneRM / (1 + reps / 30)) : null,
  }));
}

function allSetsFor(exerciseId, history) {
  const sets = [];
  for (const sess of history) {
    const entry = sess.entries.find((e) => e.exerciseId === exerciseId);
    if (entry) sets.push(...entry.sets);
  }
  return sets;
}

function foundationFor(exerciseId, history) {
  const sets = allSetsFor(exerciseId, history);
  if (sets.length === 0) return null;
  return sets.reduce((best, s) =>
    estimate1RM(s.weight, s.reps, s.rpe) > estimate1RM(best.weight, best.reps, best.rpe) ? s : best
  , sets[0]);
}

function lastLoggedSetFor(exerciseId, history) {
  for (const sess of history) {
    const entry = sess.entries.find((e) => e.exerciseId === exerciseId);
    if (entry && entry.sets.length) return entry.sets[entry.sets.length - 1];
  }
  return null;
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function PlateTimer({ seconds, total, running }) {
  const pct = total > 0 ? Math.min(1, seconds / total) : 0;
  const r = 54;
  const c = 2 * Math.PI * r;
  return (
    <div className="relative w-36 h-36 flex items-center justify-center">
      <svg width="144" height="144" viewBox="0 0 144 144" className="-rotate-90">
        <circle cx="72" cy="72" r={r} fill="none" stroke="#2A2A2A" strokeWidth="10" />
        <circle
          cx="72"
          cy="72"
          r={r}
          fill="none"
          stroke="#E8231C"
          strokeWidth="10"
          strokeLinecap="round"
          strokeDasharray={c}
          strokeDashoffset={c * (1 - pct)}
          style={{ transition: running ? "stroke-dashoffset 1s linear" : "none" }}
        />
      </svg>
      <div className="absolute flex flex-col items-center">
        <span className="text-3xl font-bold tabular-nums" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
          {formatClock(seconds)}
        </span>
        <span className="text-[10px] tracking-widest uppercase" style={{ color: "#8C8F94" }}>rest</span>
      </div>
    </div>
  );
}

function StepperInput({ value, onChange, step = 1, min = 0, suffix = "" }) {
  return (
    <div className="flex items-center gap-2">
      <button
        onClick={() => onChange(Math.max(min, value - step))}
        className="w-9 h-9 rounded-lg flex items-center justify-center active:scale-95 transition"
        style={{ background: "#2A2A2A", color: "#F2F0EA" }}
      >
        <Minus size={16} />
      </button>
      <div className="w-16 text-center">
        <span className="text-xl font-bold tabular-nums" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
          {value}
        </span>
        {suffix && <span className="text-xs ml-1" style={{ color: "#8C8F94" }}>{suffix}</span>}
      </div>
      <button
        onClick={() => onChange(value + step)}
        className="w-9 h-9 rounded-lg flex items-center justify-center active:scale-95 transition"
        style={{ background: "#3D3110", color: "#F5C518" }}
      >
        <Plus size={16} />
      </button>
    </div>
  );
}

function WorkoutLogger() {
  const [view, setView] = useState("home");
  const [session, setSession] = useState(null);
  const [history, setHistory] = useState(() => {
    try {
      const raw = localStorage.getItem("wl.history");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [weekPlan, setWeekPlan] = useState(() => {
    try {
      const raw = localStorage.getItem("wl.weekPlan");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [completedGroups, setCompletedGroups] = useState(() => {
    try {
      const raw = localStorage.getItem("wl.completedGroups");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [restSeconds, setRestSeconds] = useState(0);
  const [restTotal, setRestTotal] = useState(90);
  const [restRunning, setRestRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    localStorage.setItem("wl.history", JSON.stringify(history));
  }, [history]);

  useEffect(() => {
    localStorage.setItem("wl.weekPlan", JSON.stringify(weekPlan));
  }, [weekPlan]);

  useEffect(() => {
    localStorage.setItem("wl.completedGroups", JSON.stringify(completedGroups));
  }, [completedGroups]);

  useEffect(() => {
    if (restRunning && restSeconds > 0) {
      intervalRef.current = setInterval(() => {
        setRestSeconds((s) => {
          if (s <= 1) {
            setRestRunning(false);
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [restRunning, restSeconds]);

  function startSession() {
    setSession({ id: uid(), startedAt: Date.now(), entries: [] });
    setView("session");
  }

  function addExerciseToSession(exerciseId) {
    setSession((s) => {
      if (s.entries.find((e) => e.exerciseId === exerciseId)) return s;
      return { ...s, entries: [...s.entries, { exerciseId, sets: [] }] };
    });
    setView("session");
  }

  function addSet(exerciseId, weight, reps, rpe) {
    setSession((s) => ({
      ...s,
      entries: s.entries.map((e) =>
        e.exerciseId === exerciseId
          ? { ...e, sets: [...e.sets, { id: uid(), weight, reps, rpe }] }
          : e
      ),
    }));
    setRestSeconds(restTotal);
    setRestRunning(true);
  }

  function removeSet(exerciseId, setId) {
    setSession((s) => ({
      ...s,
      entries: s.entries.map((e) =>
        e.exerciseId === exerciseId
          ? { ...e, sets: e.sets.filter((st) => st.id !== setId) }
          : e
      ),
    }));
  }

  function finishSession() {
    if (session && session.entries.some((e) => e.sets.length > 0)) {
      setHistory((h) => [{ ...session, endedAt: Date.now() }, ...h]);
      const touchedGroups = [
        ...new Set(
          session.entries
            .filter((e) => e.sets.length > 0)
            .map((e) => EXERCISE_LIBRARY.find((ex) => ex.id === e.exerciseId)?.group)
            .filter(Boolean)
        ),
      ];
      setCompletedGroups((prev) => {
        const next = [...prev];
        touchedGroups.forEach((g) => {
          if (weekPlan.includes(g) && !next.includes(g)) next.push(g);
        });
        return next;
      });
    }
    setSession(null);
    setRestRunning(false);
    setRestSeconds(0);
    setView("home");
  }

  function savePlan(ids) {
    setWeekPlan(ids);
    setCompletedGroups([]);
  }

  function resetWeek() {
    setWeekPlan([]);
    setCompletedGroups([]);
  }

  function toggleGroupDone(id) {
    setCompletedGroups((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  }

  function statsFor(exerciseId) {
    return {
      lastSet: lastLoggedSetFor(exerciseId, history),
      foundation: foundationFor(exerciseId, history),
      ladder: ladderFor(exerciseId, history),
    };
  }

  const totalVolumeAllTime = history.reduce(
    (sum, s) => sum + s.entries.reduce((es, e) => es + e.sets.reduce((ss, st) => ss + st.weight * st.reps, 0), 0),
    0
  );

  const remainingGroups = weekPlan.filter((g) => !completedGroups.includes(g));
  const lastCompletedGroup = completedGroups[completedGroups.length - 1] || null;
  const schedule = optimalOrder(remainingGroups, lastCompletedGroup);
  const nextGroup = schedule[0] || null;

  return (
    <div
      className="min-h-screen flex flex-col"
      style={{
        background: "#060606",
        fontFamily: "'Inter', system-ui, sans-serif",
        paddingTop: "env(safe-area-inset-top)",
      }}
    >
      <div className="flex-1 overflow-y-auto px-5 pb-24">
        {view === "home" && (
          <HomeView
            onStart={startSession}
            onHistory={() => setView("history")}
            onSchedule={() => setView("schedule")}
            totalVolumeAllTime={totalVolumeAllTime}
            sessionCount={history.length}
            history={history}
            weekPlan={weekPlan}
            nextGroup={nextGroup}
            lastCompletedGroup={lastCompletedGroup}
          />
        )}

        {view === "picker" && (
          <PickerView
            onBack={() => setView("session")}
            onPick={addExerciseToSession}
            alreadyAdded={session ? session.entries.map((e) => e.exerciseId) : []}
          />
        )}

        {view === "session" && session && (
          <SessionView
            session={session}
            onAddExercise={() => setView("picker")}
            onAddSet={addSet}
            onRemoveSet={removeSet}
            onFinish={finishSession}
            statsFor={statsFor}
            restSeconds={restSeconds}
            restTotal={restTotal}
            restRunning={restRunning}
            setRestRunning={setRestRunning}
            setRestSeconds={setRestSeconds}
            setRestTotal={setRestTotal}
          />
        )}

        {view === "history" && (
          <HistoryView history={history} onBack={() => setView("home")} />
        )}

        {view === "schedule" && (
          <ScheduleView
            weekPlan={weekPlan}
            completedGroups={completedGroups}
            schedule={schedule}
            onSavePlan={savePlan}
            onResetWeek={resetWeek}
            onToggleDone={toggleGroupDone}
          />
        )}
      </div>

      {view !== "picker" && (
        <div
          className="fixed bottom-0 left-0 right-0 flex justify-around items-center pt-3"
          style={{
            background: "#141414",
            borderTop: "1px solid #2A2A2A",
            paddingBottom: "calc(env(safe-area-inset-bottom) + 12px)",
          }}
        >
          <button
            onClick={() => (session ? setView("session") : setView("home"))}
            className="flex flex-col items-center gap-1"
            style={{ color: view === "home" || view === "session" ? "#F5C518" : "#8C8F94" }}
          >
            <Dumbbell size={20} />
            <span className="text-[10px] uppercase tracking-wide">{session ? "Session" : "Train"}</span>
          </button>
          <button
            onClick={() => setView("schedule")}
            className="flex flex-col items-center gap-1"
            style={{ color: view === "schedule" ? "#F5C518" : "#8C8F94" }}
          >
            <Calendar size={20} />
            <span className="text-[10px] uppercase tracking-wide">Schedule</span>
          </button>
          <button
            onClick={() => setView("history")}
            className="flex flex-col items-center gap-1"
            style={{ color: view === "history" ? "#F5C518" : "#8C8F94" }}
          >
            <History size={20} />
            <span className="text-[10px] uppercase tracking-wide">History</span>
          </button>
        </div>
      )}
    </div>
  );
}

function HomeView({ onStart, onHistory, onSchedule, totalVolumeAllTime, sessionCount, history, weekPlan, nextGroup, lastCompletedGroup }) {
  const trainedIds = [...new Set(history.flatMap((s) => s.entries.map((e) => e.exerciseId)))];

  return (
    <div className="pt-8">
      <p className="text-xs tracking-[0.2em] uppercase" style={{ color: "#8C8F94" }}>Ready to lift</p>
      <h1
        className="text-4xl font-bold mt-1 mb-6"
        style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}
      >
        Log today's<br />session
      </h1>

      {weekPlan.length > 0 && nextGroup && (
        <button
          onClick={onSchedule}
          className="w-full mb-4 rounded-2xl p-4 text-left active:scale-[0.98] transition"
          style={{ background: "#3D3110", border: "1px solid #F5C518" }}
        >
          <div className="flex items-center justify-between">
            <p className="text-[10px] uppercase tracking-widest" style={{ color: "#F5C518" }}>Next up</p>
            <ArrowRight size={14} style={{ color: "#F5C518" }} />
          </div>
          <p className="text-2xl font-bold mt-0.5" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
            {nextGroup}
          </p>
          <p className="text-xs mt-1" style={{ color: "#C9A84F" }}>{reasonFor(nextGroup, lastCompletedGroup)}</p>
        </button>
      )}

      {weekPlan.length === 0 && (
        <button
          onClick={onSchedule}
          className="w-full mb-4 rounded-2xl p-4 text-left active:scale-[0.98] transition"
          style={{ background: "#1C1C1C", border: "1px dashed #3D3110" }}
        >
          <p className="text-sm font-medium" style={{ color: "#F2F0EA" }}>Build this week's schedule</p>
          <p className="text-xs mt-1" style={{ color: "#8C8F94" }}>Pick your muscle groups and get an optimized order</p>
        </button>
      )}

      <button
        onClick={onStart}
        className="w-full py-4 rounded-2xl font-semibold text-lg flex items-center justify-center gap-2 active:scale-[0.98] transition"
        style={{ background: "#E8231C", color: "#F2F0EA" }}
      >
        <Plus size={20} strokeWidth={3} />
        Start Workout
      </button>

      <div className="grid grid-cols-2 gap-3 mt-6">
        <div className="rounded-2xl p-4" style={{ background: "#1C1C1C" }}>
          <p className="text-2xl font-bold" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>{sessionCount}</p>
          <p className="text-xs mt-1" style={{ color: "#8C8F94" }}>sessions logged</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: "#1C1C1C" }}>
          <p className="text-2xl font-bold" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
            {totalVolumeAllTime.toLocaleString()}
          </p>
          <p className="text-xs mt-1" style={{ color: "#8C8F94" }}>lbs total volume</p>
        </div>
      </div>

      {trainedIds.length > 0 && (
        <div className="mt-6">
          <p className="text-xs uppercase tracking-widest mb-2" style={{ color: "#8C8F94" }}>Foundations & Next Ladder</p>
          <div className="flex flex-col gap-2">
            {trainedIds.map((id) => {
              const meta = EXERCISE_LIBRARY.find((e) => e.id === id);
              const foundation = foundationFor(id, history);
              const ladder = ladderFor(id, history);
              return (
                <div key={id} className="rounded-xl px-4 py-3" style={{ background: "#1C1C1C" }}>
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-sm font-medium" style={{ color: "#F2F0EA" }}>{meta?.name}</p>
                    <p className="text-[11px]" style={{ color: "#8C8F94" }}>
                      1RM {estimate1RM(foundation.weight, foundation.reps, foundation.rpe)}lb
                    </p>
                  </div>
                  <p className="text-xs tabular-nums" style={{ color: "#F5C518" }}>
                    {ladder.map((t) => `${t.reps}×${t.weight ?? "—"}`).join("  ·  ")}
                  </p>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <button
        onClick={onHistory}
        className="w-full mt-6 py-3 rounded-2xl font-medium flex items-center justify-center gap-2"
        style={{ background: "transparent", color: "#8C8F94", border: "1px solid #2A2A2A" }}
      >
        View history
      </button>
    </div>
  );
}

function PickerView({ onBack, onPick, alreadyAdded }) {
  const [query, setQuery] = useState("");
  const q = query.trim().toLowerCase();
  const filtered = q ? EXERCISE_LIBRARY.filter((e) => e.name.toLowerCase().includes(q)) : EXERCISE_LIBRARY;
  const groups = [...new Set(filtered.map((e) => e.group))];

  return (
    <div className="pt-8">
      <button onClick={onBack} className="flex items-center gap-1 mb-4" style={{ color: "#8C8F94" }}>
        <ChevronLeft size={18} />
        <span className="text-sm">Back</span>
      </button>
      <h2 className="text-2xl font-bold mb-4" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
        Add exercise
      </h2>

      <div className="relative mb-5">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#8C8F94" }} />
        <input
          type="text"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Search exercises..."
          className="w-full py-2.5 pl-9 pr-9 rounded-xl outline-none text-sm"
          style={{ background: "#1C1C1C", color: "#F2F0EA", border: "1px solid #2A2A2A" }}
        />
        {query && (
          <button onClick={() => setQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "#8C8F94" }}>
            <X size={16} />
          </button>
        )}
      </div>

      {filtered.length === 0 && (
        <p className="text-sm text-center mt-6" style={{ color: "#8C8F94" }}>No exercises match "{query}"</p>
      )}

      {groups.map((g) => (
        <div key={g} className="mb-5">
          <p className="text-xs uppercase tracking-widest mb-2" style={{ color: "#8C8F94" }}>{g}</p>
          <div className="flex flex-col gap-2">
            {filtered.filter((e) => e.group === g).map((ex) => {
              const added = alreadyAdded.includes(ex.id);
              return (
                <button
                  key={ex.id}
                  disabled={added}
                  onClick={() => onPick(ex.id)}
                  className="w-full py-3 px-4 rounded-xl flex items-center justify-between text-left active:scale-[0.98] transition"
                  style={{ background: "#1C1C1C", opacity: added ? 0.4 : 1 }}
                >
                  <span style={{ color: "#F2F0EA" }}>{ex.name}</span>
                  {added ? <Check size={18} style={{ color: "#C9A227" }} /> : <Plus size={18} style={{ color: "#F5C518" }} />}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function SessionView({
  session, onAddExercise, onAddSet, onRemoveSet, onFinish, statsFor,
  restSeconds, restTotal, restRunning, setRestRunning, setRestSeconds, setRestTotal,
}) {
  return (
    <div className="pt-6">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-2xl font-bold" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
          In Session
        </h2>
        <button
          onClick={onFinish}
          className="text-sm font-semibold px-3 py-1.5 rounded-lg"
          style={{ background: "#3D3110", color: "#F5C518" }}
        >
          Finish
        </button>
      </div>

      {restSeconds > 0 && (
        <div className="flex flex-col items-center mb-6">
          <PlateTimer seconds={restSeconds} total={restTotal} running={restRunning} />
          <div className="flex gap-2 mt-2">
            <button onClick={() => setRestRunning((r) => !r)} className="text-xs px-3 py-1 rounded-full" style={{ background: "#2A2A2A", color: "#F2F0EA" }}>
              {restRunning ? "Pause" : "Resume"}
            </button>
            <button onClick={() => { setRestRunning(false); setRestSeconds(0); }} className="text-xs px-3 py-1 rounded-full" style={{ background: "#2A2A2A", color: "#8C8F94" }}>
              Skip
            </button>
          </div>
        </div>
      )}

      {session.entries.length === 0 && (
        <div className="rounded-2xl p-6 text-center mb-4" style={{ background: "#1C1C1C" }}>
          <p style={{ color: "#8C8F94" }}>No exercises yet. Add your first movement to start logging sets.</p>
        </div>
      )}

      <div className="flex flex-col gap-4">
        {session.entries.map((entry) => (
          <ExerciseCard
            key={entry.exerciseId}
            entry={entry}
            stats={statsFor(entry.exerciseId)}
            onAddSet={(w, r, rpe) => onAddSet(entry.exerciseId, w, r, rpe)}
            onRemoveSet={(setId) => onRemoveSet(entry.exerciseId, setId)}
          />
        ))}
      </div>

      <button
        onClick={onAddExercise}
        className="w-full mt-4 py-3 rounded-2xl font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition"
        style={{ background: "#1C1C1C", color: "#F5C518", border: "1px dashed #3D3110" }}
      >
        <Plus size={18} />
        Add Exercise
      </button>
    </div>
  );
}

function ExerciseCard({ entry, stats, onAddSet, onRemoveSet }) {
  const meta = EXERCISE_LIBRARY.find((e) => e.id === entry.exerciseId);
  const { lastSet, foundation, ladder } = stats;
  const setsDone = entry.sets.length;
  const nextTarget = setsDone < ladder.length ? ladder[setsDone] : null;

  const [weight, setWeight] = useState(nextTarget?.weight ?? (lastSet ? lastSet.weight : 45));
  const [reps, setReps] = useState(nextTarget?.reps ?? (lastSet ? lastSet.reps : 8));
  const [rpe, setRpe] = useState(8);

  useEffect(() => {
    if (nextTarget) {
      setReps(nextTarget.reps);
      if (nextTarget.weight) setWeight(nextTarget.weight);
    }
  }, [setsDone]);

  return (
    <div className="rounded-2xl p-4" style={{ background: "#1C1C1C" }}>
      <div className="flex items-center justify-between mb-2">
        <h3 className="font-semibold" style={{ color: "#F2F0EA" }}>{meta?.name}</h3>
        {lastSet && (
          <span className="text-xs" style={{ color: "#8C8F94" }}>
            last: {lastSet.weight}lb × {lastSet.reps}{lastSet.rpe ? ` @ RPE ${lastSet.rpe}` : ""}
          </span>
        )}
      </div>

      {foundation && (
        <p className="text-[11px] mb-2" style={{ color: "#8C8F94" }}>
          foundation {foundation.weight}lb × {foundation.reps}{foundation.rpe ? ` @ RPE ${foundation.rpe}` : ""} · est. 1RM {estimate1RM(foundation.weight, foundation.reps, foundation.rpe)}lb
        </p>
      )}

      <div className="mb-3">
        <p className="text-[10px] uppercase tracking-widest mb-1.5" style={{ color: "#8C8F94" }}>Ladder — this session</p>
        <div className="flex gap-1.5">
          {ladder.map((t, i) => {
            const done = i < setsDone;
            const isNext = i === setsDone;
            return (
              <div
                key={i}
                className="flex-1 rounded-lg py-2 text-center"
                style={{
                  background: isNext ? "#3D3110" : done ? "#241F0C" : "#121212",
                  border: isNext ? "1px solid #F5C518" : "1px solid transparent",
                }}
              >
                <p className="text-sm font-bold tabular-nums" style={{ color: isNext ? "#F5C518" : done ? "#C9A227" : "#8C8F94" }}>
                  {t.reps}
                </p>
                <p className="text-[10px] tabular-nums" style={{ color: isNext ? "#C9A84F" : "#6B6E73" }}>
                  {t.weight ? `${t.weight}lb` : "—"}
                </p>
              </div>
            );
          })}
        </div>
        {setsDone >= ladder.length && (
          <p className="text-[11px] mt-1.5" style={{ color: "#C9A227" }}>Ladder complete — nice work.</p>
        )}
      </div>

      {entry.sets.length > 0 && (
        <div className="flex flex-col gap-1.5 mb-3">
          {entry.sets.map((st, i) => (
            <div key={st.id} className="flex items-center justify-between text-sm py-1.5 px-3 rounded-lg" style={{ background: "#121212" }}>
              <span style={{ color: "#8C8F94" }}>Set {i + 1}</span>
              <span className="font-medium tabular-nums" style={{ color: "#F2F0EA" }}>{st.weight}lb × {st.reps}</span>
              {st.rpe && (
                <span
                  className="text-xs font-semibold tabular-nums px-1.5 py-0.5 rounded"
                  style={{ color: st.rpe >= 9 ? "#E8231C" : "#8C8F94", background: "#1C1C1C" }}
                >
                  RPE {st.rpe}
                </span>
              )}
              <button onClick={() => onRemoveSet(st.id)} style={{ color: "#8C8F94" }}>
                <X size={14} />
              </button>
            </div>
          ))}
        </div>
      )}

      <div className="flex items-center justify-between mb-3">
        <StepperInput value={weight} onChange={setWeight} step={5} suffix="lb" />
        <StepperInput value={reps} onChange={setReps} step={1} suffix="reps" />
      </div>

      <div className="mb-3">
        <p className="text-[10px] uppercase tracking-widest mb-1.5" style={{ color: "#8C8F94" }}>Effort (RPE)</p>
        <div className="flex gap-1.5">
          {[6, 7, 8, 9, 10].map((r) => (
            <button
              key={r}
              onClick={() => setRpe(r)}
              className="flex-1 py-2 rounded-lg text-sm font-semibold tabular-nums transition"
              style={{
                background: rpe === r ? "#F5C518" : "#121212",
                color: rpe === r ? "#121212" : "#8C8F94",
              }}
            >
              {r}
            </button>
          ))}
        </div>
      </div>

      <button
        onClick={() => onAddSet(weight, reps, rpe)}
        className="w-full py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition"
        style={{ background: "#E8231C", color: "#F2F0EA" }}
      >
        <Check size={16} strokeWidth={3} />
        Log Set
      </button>
    </div>
  );
}

function HistoryView({ history, onBack }) {
  return (
    <div className="pt-8">
      <h2 className="text-2xl font-bold mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
        History
      </h2>
      {history.length === 0 && (
        <div className="rounded-2xl p-6 text-center" style={{ background: "#1C1C1C" }}>
          <p style={{ color: "#8C8F94" }}>No sessions yet. Finish a workout to see it here.</p>
        </div>
      )}
      <div className="flex flex-col gap-3">
        {history.map((s) => {
          const date = new Date(s.startedAt);
          const volume = s.entries.reduce((sum, e) => sum + e.sets.reduce((ss, st) => ss + st.weight * st.reps, 0), 0);
          const totalSets = s.entries.reduce((sum, e) => sum + e.sets.length, 0);
          const rpeValues = s.entries.flatMap((e) => e.sets.map((st) => st.rpe).filter(Boolean));
          const avgRpe = rpeValues.length ? (rpeValues.reduce((a, b) => a + b, 0) / rpeValues.length).toFixed(1) : null;
          return (
            <div key={s.id} className="rounded-2xl p-4" style={{ background: "#1C1C1C" }}>
              <div className="flex items-center justify-between mb-2">
                <span className="font-semibold" style={{ color: "#F2F0EA" }}>
                  {date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                </span>
                <span className="text-xs flex items-center gap-1" style={{ color: "#8C8F94" }}>
                  <TrendingUp size={12} />
                  {volume.toLocaleString()} lb
                </span>
              </div>
              <p className="text-xs mb-2" style={{ color: "#8C8F94" }}>
                {s.entries.length} exercises · {totalSets} sets{avgRpe ? ` · avg RPE ${avgRpe}` : ""}
              </p>
              <div className="flex flex-wrap gap-1.5">
                {s.entries.map((e) => {
                  const meta = EXERCISE_LIBRARY.find((ex) => ex.id === e.exerciseId);
                  return (
                    <span key={e.exerciseId} className="text-[11px] px-2 py-1 rounded-full" style={{ background: "#121212", color: "#8C8F94" }}>
                      {meta?.name}
                    </span>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScheduleView({ weekPlan, completedGroups, schedule, onSavePlan, onResetWeek, onToggleDone }) {
  const [selected, setSelected] = useState([]);

  if (weekPlan.length === 0) {
    return (
      <div className="pt-8">
        <h2 className="text-2xl font-bold mb-1" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
          Plan your week
        </h2>
        <p className="text-sm mb-5" style={{ color: "#8C8F94" }}>
          Pick the muscle groups you're training this week. We'll order them to optimize recovery and growth.
        </p>
        <div className="flex flex-col gap-2 mb-6">
          {MUSCLE_GROUPS.map((g) => {
            const isSelected = selected.includes(g.id);
            return (
              <button
                key={g.id}
                onClick={() =>
                  setSelected((prev) =>
                    prev.includes(g.id) ? prev.filter((x) => x !== g.id) : [...prev, g.id]
                  )
                }
                className="w-full py-3 px-4 rounded-xl flex items-center justify-between text-left active:scale-[0.98] transition"
                style={{ background: isSelected ? "#3D3110" : "#1C1C1C", border: isSelected ? "1px solid #F5C518" : "1px solid transparent" }}
              >
                <span style={{ color: "#F2F0EA" }}>{g.id}</span>
                {isSelected ? <Check size={18} style={{ color: "#F5C518" }} /> : <Plus size={18} style={{ color: "#8C8F94" }} />}
              </button>
            );
          })}
        </div>
        <button
          onClick={() => selected.length > 0 && onSavePlan(selected)}
          disabled={selected.length === 0}
          className="w-full py-4 rounded-2xl font-semibold text-lg active:scale-[0.98] transition"
          style={{ background: selected.length ? "#E8231C" : "#2A2A2A", color: selected.length ? "#F2F0EA" : "#8C8F94" }}
        >
          Build Schedule
        </button>
      </div>
    );
  }

  return (
    <div className="pt-8">
      <div className="flex items-center justify-between mb-1">
        <h2 className="text-2xl font-bold" style={{ fontFamily: "'Oswald', sans-serif", color: "#F2F0EA" }}>
          This Week
        </h2>
        <button onClick={onResetWeek} className="text-xs" style={{ color: "#8C8F94" }}>Reset</button>
      </div>
      <p className="text-sm mb-5" style={{ color: "#8C8F94" }}>
        Tap a session to mark it done or undo. Order updates automatically to space out overlapping muscle groups.
      </p>

      {completedGroups.length > 0 && (
        <div className="flex flex-col gap-2 mb-4">
          {completedGroups.map((g, i) => (
            <button
              key={g}
              onClick={() => onToggleDone(g)}
              className="w-full py-3 px-4 rounded-xl flex items-center justify-between text-left active:scale-[0.98] transition"
              style={{ background: "#241F0C", opacity: 0.8 }}
            >
              <div className="flex items-center gap-2">
                <Check size={16} style={{ color: "#C9A227" }} />
                <span style={{ color: "#F2F0EA" }}>{g}</span>
              </div>
              <span className="text-[10px] uppercase tracking-widest" style={{ color: "#C9A227" }}>Done</span>
            </button>
          ))}
        </div>
      )}

      <div className="flex flex-col gap-2">
        {schedule.map((g, i) => (
          <button
            key={g}
            onClick={() => onToggleDone(g)}
            className="w-full py-3 px-4 rounded-xl flex items-center justify-between text-left active:scale-[0.98] transition"
            style={{
              background: i === 0 ? "#3D3110" : "#1C1C1C",
              border: i === 0 ? "1px solid #F5C518" : "1px solid transparent",
            }}
          >
            <div className="flex items-center gap-3">
              <span
                className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                style={{ background: i === 0 ? "#F5C518" : "#2A2A2A", color: i === 0 ? "#121212" : "#8C8F94" }}
              >
                {i + 1}
              </span>
              <div>
                <span style={{ color: i === 0 ? "#F5C518" : "#F2F0EA" }} className="font-medium">{g}</span>
                {i === 0 && <p className="text-[10px] mt-0.5" style={{ color: "#C9A84F" }}>Next up</p>}
              </div>
            </div>
            <span className="text-[10px] uppercase tracking-widest" style={{ color: "#8C8F94" }}>{groupPattern(g)}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkoutLogger />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
